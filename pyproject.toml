[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "param-brahmand"
version = "3.0.0"
description = "PARAM-BRAHMAND (विश्वरूप-AI) — 7-Layer Earth Intelligence OS for ISRO SAC"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "PARAM-BRAHMAND Team", email = "param-brahmand@isro-sac.gov.in" }
]
keywords = [
  "remote-sensing", "satellite-imagery", "ISRO", "SAR", "earth-observation",
  "deep-learning", "geospatial", "physics-guided-ai", "Smart-India-Hackathon",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "requests>=2.31.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
training = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
param-brahmand = "param_brahmand_complete_system:main"
param-brahmand-api = "param_brahmand.api.main:start"

[project.urls]
Homepage = "https://github.com/BaggaByte/PARAM-BRAHMAND"
Repository = "https://github.com/BaggaByte/PARAM-BRAHMAND"
"Bug Tracker" = "https://github.com/BaggaByte/PARAM-BRAHMAND/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["param_brahmand*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["param_brahmand"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
